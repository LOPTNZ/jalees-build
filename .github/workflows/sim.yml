name: Simulator check
# Builds the app for the iOS Simulator, opens the screens listed in tools/sim/routes.txt and keeps a picture of each.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: |
          sw_vers | tr '\n' ' '; echo
          xcodebuild -version | tr '\n' ' '; echo
          ls /Applications | grep -i xcode | tr '\n' ' '; echo
          xcrun simctl list runtimes | grep -i ios || true
      - name: Tools
        run: which xcodegen || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Wird.xcodeproj -scheme Wird -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|error |BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Debug-iphonesimulator/Wird.app/Wird
      - name: Open the screens and take pictures
        run: bash tools/sim/shots.sh
      - name: Pictures on an iPad
        if: always()
        timeout-minutes: 15
        run: |
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;t=[x for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPad Pro 11') or x['name'].startswith('iPad Air 11')];print(t[-1]['identifier'])")
          SHOTS_DEVICE="$TYPE" SHOTS_NAME=JaleesPadShots SHOTS_OUT=out-sim/pad bash tools/sim/shots.sh || true
          xcrun simctl shutdown JaleesPadShots || true
      - name: A test server on a Tailscale-style address
        if: always()
        run: |
          # the owner's server is plain http on 100.x (Tailscale): WirdTests/NetworkTests reaches this one from inside the app
          sudo ifconfig lo0 alias 100.64.0.1 up || true
          mkdir -p "$RUNNER_TEMP/srv" && printf '{"ok":true,"novels":0,"checking":false}' > "$RUNNER_TEMP/srv/health"
          ( cd "$RUNNER_TEMP/srv" && nohup python3 -m http.server 8790 --bind 100.64.0.1 > "$RUNNER_TEMP/srv.log" 2>&1 & )
          sleep 1; curl -s -m 5 http://100.64.0.1:8790/health || echo "test server not reachable"
      - name: Walk through the app (UI tests)
        # a commit named "… quick" (QUICK=1 bash tools/push_build.sh) stops after the pictures
        if: always() && !contains(github.event.head_commit.message, 'quick')
        timeout-minutes: 40
        run: |
          mkdir -p out-sim/ui
          # a fresh install: the demo library, not what the pictures above changed
          xcrun simctl uninstall Jalees13 com.abdullah.wird.reader || true
          # the screen is recorded, so the animations can be looked at frame by frame (tools/sim/frames.swift)
          xcrun simctl io Jalees13 recordVideo --codec=h264 --force walk.mp4 2> rec.log &
          REC=$!
          for i in $(seq 1 60); do grep -q "Recording started" rec.log && break; sleep 0.1; done
          python3 -c 'import time; print(time.time())' > out-sim/rec-start
          mkdir -p out-sim/ui/samples
          # the app sampled every 30 s: a long freeze shows what its threads were doing
          ( while true; do sleep 30; for pid in $(pgrep -f "Wird.app/Wird"); do sample "$pid" 1 -file "out-sim/ui/samples/$(date +%H%M%S)-$pid.txt" > /dev/null 2>&1; done; done ) &
          SAMPLER=$!
          TEST_RUNNER_SHOTS="$PWD/out-sim/ui" xcodebuild test -project Wird.xcodeproj -scheme Wird             -destination 'platform=iOS Simulator,name=Jalees13' -derivedDataPath build             ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""             2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|: error|XCTAssert|not found|TEST (SUCCEEDED|FAILED)" || true
          kill -INT $REC 2>/dev/null; wait $REC 2>/dev/null || true
          kill $SAMPLER 2>/dev/null || true
          swift tools/sim/frames.swift walk.mp4 out-sim/rec-start out-sim/ui/marks.txt out-sim/frames || true
          # what the sites' lists asked for during the walk (a list must not keep loading by itself)
          xcrun simctl spawn Jalees13 log show --last 60m --predicate 'process == "Wird"' --style compact 2>/dev/null | grep -i "jalees browse" | tail -300 > out-sim/ui/browse.log || true
      - name: Walk through on an iPad
        if: always() && !contains(github.event.head_commit.message, 'quick')
        timeout-minutes: 22
        run: |
          mkdir -p out-sim/ipad
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and x['platform']=='iOS'];r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]);print(r[-1]['identifier'])")
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys;t=[x for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPad Pro 11') or x['name'].startswith('iPad Air 11')];print(t[-1]['identifier'])")
          echo "ipad: $TYPE on $RT"
          xcrun simctl create JaleesPad "$TYPE" "$RT" || true
          mkdir -p out-sim/ipad/samples
          ( while true; do sleep 30; for pid in $(pgrep -f "Wird.app/Wird"); do sample "$pid" 1 -file "out-sim/ipad/samples/$(date +%H%M%S)-$pid.txt" > /dev/null 2>&1; done; done ) &
          SAMPLER=$!
          TEST_RUNNER_SHOTS="$PWD/out-sim/ipad" xcodebuild test -project Wird.xcodeproj -scheme Wird             -destination 'platform=iOS Simulator,name=JaleesPad' -derivedDataPath build             -only-testing:WirdUITests/FlowTests/test01Tabs -only-testing:WirdUITests/FlowTests/test03BookPage             -only-testing:WirdUITests/FlowTests/test05NotebookQuote -only-testing:WirdUITests/FlowTests/test10ReaderChapters             -only-testing:WirdUITests/FlowTests/test14BrowseSites             ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""             2>&1 | tee test-ipad.log | grep -E "error:|Test Case .*(passed|failed)|: error|XCTAssert|not found|TEST (SUCCEEDED|FAILED)" || true
          kill $SAMPLER 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim
          retention-days: 5
          path: |
            out-sim/
            build.log
            test.log
            test-ipad.log
            release.log
