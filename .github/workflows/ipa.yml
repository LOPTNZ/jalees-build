name: IPA
# Builds the phone app (unsigned, two IPAs: clean and demo), only when asked.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Wird.xcodeproj -scheme Wird -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/Wird.app/Wird
      - name: Package two IPAs (entitlements embedded so SideStore keeps the App Group)
        run: |
          APP=build/Build/Products/Release-iphoneos/Wird.app
          pack() {
            rm -rf out && mkdir -p out/Payload && cp -R "$APP" out/Payload/Wird.app
            /usr/libexec/PlistBuddy -c "Set :WirdEdition $1" out/Payload/Wird.app/Info.plist
            ldid -SWirdWidget/WirdWidget.entitlements out/Payload/Wird.app/PlugIns/WirdWidget.appex/WirdWidget
            ldid -SWird/Wird.entitlements out/Payload/Wird.app/Wird
            (cd out && zip -qry "../$2" Payload)
          }
          pack clean Jalees.ipa
          pack demo Jalees-Demo.ipa
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          retention-days: 2
          path: |
            Jalees.ipa
            Jalees-Demo.ipa
