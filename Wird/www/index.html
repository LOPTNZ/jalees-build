  notebook:'<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h6M10 12h6M10 16h3"/>',
  browse:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  progress:'<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 3M7 5H4a3 3 0 0 0 3 3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  updates:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.6 2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  downloads:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
var NAV_SETS={
  main:[['library','المكتبة'],['notebook','دفتري'],['progress','إنجازاتي'],['settings','الإعدادات']],
  novels:[['browse','تصفّح'],['updates','التحديثات'],['downloads','التحميلات'],['history','السجل']]
};
var NAV={set:'main',cur:{main:'library',novels:'browse'}};
function navNative(t){return t==='browse'||t==='updates'||t==='downloads'||t==='history'}
/* back to Jalees's group without a tap on the bar (the reader opened the notebook, say) */
function navMain(){if(NAV.set!=='main'){NAV.set='main';ui.navTab='';navSync()}}
function navDraw(){var n=$('#nav');if(!n)return;n.classList.add('duo');
  n.innerHTML=['main','novels'].map(function(g){var set=NAV_SETS[g];
    return '<div class="navg" data-g="'+g+'" style="--pn:'+set.length+'"><i class="navpill" aria-hidden="true"></i>'+set.map(function(x){
      return '<button data-act="tab" data-t="'+x[0]+'" aria-label="'+x[1]+'"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+NAV_IC[x[0]]+'</svg><span>'+x[1]+'</span></button>'}).join('')+'</div>'}).join('');
  navSync();navTopSend();
  if(window.ResizeObserver&&!NAV.ro){NAV.ro=new ResizeObserver(navTopSend);NAV.ro.observe(n,{box:'border-box'})}
  window.addEventListener('resize',navTopSend)}
function navTopSend(){var n=$('#nav');if(!n||!isMob())return;var t=Math.round(n.getBoundingClientRect().top);
  if(t>0&&t!==NAV.top){NAV.top=t;N.post('novel',{op:'navTop',top:t})}}
/* only classes change from here on, so the groups grow and shrink smoothly */
function navSync(){var n=$('#nav');if(!n||!n.classList.contains('duo'))return;
  if(NAV.set==='main'&&NAV_SETS.main.some(function(x){return x[0]===ui.tab}))NAV.cur.main=ui.tab;
  $$('.navg',n).forEach(function(g){var k=g.dataset.g,on=k===NAV.set,cur=NAV.cur[k],i=0;
    g.classList.toggle('on',on);g.classList.toggle('off',!on);
    $$('button',g).forEach(function(b,j){var c=b.dataset.t===cur;if(c)i=j;b.classList.toggle('cur',c);b.setAttribute('aria-current',on&&c?'page':'false')});
    g.style.setProperty('--pi',i)})}
/* «إنجازاتي»: goals and stats on one page, a switch at the top */
function viewProgress(){var sub=ui.progSub||'goals';
  return '<div class="seg prog-seg" role="group"><button data-act="progSub" data-v="goals" aria-pressed="'+(sub==='goals')+'">الأهداف</button><button data-act="progSub" data-v="stats" aria-pressed="'+(sub==='stats')+'">الإحصائيات</button></div>'+
    (sub==='stats'?viewStats():viewGoals())}
if(APP&&!DROID){
  HDR_T.progress='إنجازاتي';
  var tabBase=A.tab;
  A.tab=function(t){var nt=t.dataset.t;
    if(navNative(nt)){if(NAV.set!=='novels'||NAV.cur.novels!==nt)haptic('soft');NAV.set='novels';NAV.cur.novels=nt;ui.navTab=nt;navSync();N.post('novel',{op:'tab',tab:nt});return}
    var was=NAV.set;N.post('novel',{op:'tab',tab:''});ui.navTab='';NAV.set='main';
    /* back from the novels' group to the tab you left: as it was, no jump to the top */
    if(was==='novels'&&nt===ui.tab&&!ui.view){haptic('soft');navSync();return}
    return tabBase(t)};
  A.progSub=function(t){ui.progSub=t.dataset.v;render()};
  var mainBase=renderMain;
  renderMain=function(){if(ui.tab==='progress'){var keep=ui.tab;ui.tab='goals';mainBase();ui.tab=keep;var m=$('#main');m.innerHTML=viewProgress();hydrate(m);PG.sig=mainSig();return}return mainBase()};
  var drawn=false;var syncBase=hdrSync;
  hdrSync=function(){if(!drawn){drawn=true;if(ui.tab==='goals'||ui.tab==='stats'){ui.progSub=ui.tab;ui.tab='progress'}navDraw()}else navSync();return syncBase()};
  window.wirdNovelAdopt=function(r){var id=nvEnsureBook(r),b=getBook(id);
    if(r.cover&&!b.cover)N.call('fetch',{url:r.cover,as:'dataurl'}).then(function(f){if(f&&f.ok&&f.dataurl){var i=uid();imgPut(i,f.dataurl);b.cover=i;save();render()}},function(){});
    save();render();return id};
  /* for the simulator pictures */
  window.wirdDebugTab=function(t){var b=$('#nav [data-t="'+t+'"]');if(b)A.tab(b);return !!b};
  /* waits until the carousel holds the novel (its book may have just been made), centres it, then opens it like a tap */
  window.wirdDebugCar=function(){var n=0;(function go(){var i=CV&&CAR?CAR.list.findIndex(isNovel):-1;
    if(i<0&&n++<15){if(n===5)render();setTimeout(go,200);return}
    if(i>=0){CAR.go(i);CAR.settle();setTimeout(function(){cvOpen()},400)}})();return 1};
  window.wirdNavMain=function(){navMain();return 1};
  window.wirdNavReset=function(){NAV.set='main';ui.navTab='';navSync();render();return 1};
}
})();
</script>
